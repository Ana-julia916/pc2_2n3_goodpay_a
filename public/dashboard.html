<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./bootstrap/styles_complement.css">
</head>

<body onload="storageUsersInfo()">
    <header>
        <section name="barra-navegacao">
            <nav class="navbar navbar-dark bg-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        <img src="./assets/logo_claro.png" alt="Logo Marca" width="45px" height="45px">
                    </a>
                    <div class="img-responsive">
                        <img src="./assets/letreiro-claro.png" alt="Letreiro Marca" width="30%">
                    </div>
                    <div class="icon">
                        <h4><i class="bi bi-instagram text-white"></i></h4>
                    </div>
                    <div class="icon">
                        <h4><i class="bi bi-youtube text-white"></i></h4>
                    </div>
                    <div class="icon">
                        <h4><i class="bi bi-facebook text-white"></i></h4>
                    </div>
                    <div class="icon">
                        <h4><i class="bi bi-tiktok text-white"></i></h4>
                    </div>
                    <div class="icon">
                        <h4><i class="bi bi-twitter text-white"></i></h4>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <i class="bi bi-piggy-bank-fill"></i>
                            Sua Reserva
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item active" href="#" id="saldo_conta">Saldo da Conta</a></li>
                            <li><a class="dropdown-item" href="#" id="trans_conta">Transações</a></li>
                            <li><a class="dropdown-item" href="#" id="cash_conta">CashBack</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" id="sign_out">Sair do Perfil</a></li>
                        </ul>
                    </div>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <img src="./assets/letreiro-claro.png" alt="Marca Digital" width="100%">
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <hr>
                            <div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text" id="inputGroup-sizing-default">Email</span>
                                    <input type="email" class="form-control" aria-label="Sizing example input"
                                        aria-describedby="inputGroup-sizing-default">
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text" id="inputGroup-sizing-default">Senha</span>
                                    <input type="password" class="form-control" aria-label="Sizing example input"
                                        aria-describedby="inputGroup-sizing-default">
                                </div>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-success" type="button">Login</button>
                                    <button class="btn btn-outline-success" type="button">Cadastrar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </section>
    </header>
    <main>
        <div class="container" style="margin-top:120px;">
            <div class="card mb-3" style="max-width: 100%;">
                <div class="row g-0">
                    <div class="col-md-4">
                        <span id="login-img"></span>
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h5 class="card-title" id="login-name"></h5>
                            <p class="card-text" id="login-email"></p>
                            <p class="card-text"><small class="text-body-secondary" id="login-date"></small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <script src="./engine/index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
    </footer>
</body>

</html>
